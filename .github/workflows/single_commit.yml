name: Assert Single Commit (non-blocking)

on: pull_request

permissions:
  contents: read
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 30
    - name: Checkout target branch
      run: git fetch origin ${{ github.base_ref }}
    - name: Commit Count Check
      id: commit_check
      continue-on-error: true
      run: test `git log  --oneline --no-merges HEAD ^origin/${{ github.base_ref }} | wc -l ` = 1
    - name: Create neutral check
      if: steps.commit_check.outcome == 'failure'
      run: |
        gh api repos/${{ github.repository }}/check-runs \
          --method POST \
          -f name='Single Commit Check' \
          -f head_sha=${{ github.event.pull_request.head.sha }} \
          -f status=completed \
          -f conclusion=neutral \
          -f output[title]='Multiple commits detected' \
          -f output[summary]='This PR contains multiple commits. Consider squashing them into a single commit before merging.'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
